# Blurbs for the Library chart on the home page. Add, remove or reorder freely.
# text: the quote   book: title shown in the caption   by: attribution
- text: "A novel of meteoric energy, flaring brighter and brighter as it falls further into its world."
  book: "The Salvage Crew"
  by: "Indrapramit Das, Lambda Award-winning author of The Devourers"
- text: "Wijeratne has held up a chillingly realistic mirror on our interconnected society."
  book: "Numbercaste"
  by: "Paul Anlee, author of The Reality Thief"
- text: "Everything I think of when I try and imagine what science fiction can and should be: an optimistic and beautiful journey into the cosmos that tells us something about ourselves."
  book: "Pilgrim Machines"
  by: "Andrew Liptak, author of Transfer Orbit and Cosplay: A History"
- text: "Military science fiction has seen scores of mercenary bands and hardened units facing long odds over the years, but rarely do they ever look like this."
  book: "Choir of Hatred"
  by: "Sean CW Korsgaard, Analog Science Fiction and Fact, Vol. XCV"
- text: "Space opera for the gig economy."
  book: "The Salvage Crew"
  by: "Jaideep Unudurti, The Hindu"
- text: "Prophetic, Orwellian, and not wholly inconceivable . . . the depth of Numbercaste lies in how readily we are able to envision this not-so-distant future."
  book: "Numbercaste"
  by: "Amanda Jay, author of The Other One"
- text: "If you mixed the intellectual heft and inquisition of Arthur C. Clarke with a slightly boozy raconteur on a Friday night . . . it would probably sound something like Pilgrim Machines."
  book: "Pilgrim Machines"
  by: "Thomas Trang, author of Dark Neon Dirt and The World Behind Us"
- text: ". . . there’s a clever, dark sense of humor that enjoys a slow burn throughout the novel."
  book: "Choir of Hatred"
  by: "Sean CW Korsgaard, Analog Science Fiction and Fact, Vol. XCV"
- text: "A classic sci-fi adventure wrapped around a deeply philosophical core."
  book: "The Salvage Crew"
  by: "S.B. Divya, Hugo and Nebula Award-nominated author of Machinehood"
- text: "This is a level of intellectual rigour and discipline in writing one doesn’t encounter in older more seasoned authors, published more often."
  book: "Numbercaste"
  by: "Sanjana Hattotuwa, Groundviews"
- text: "Perhaps one of the most riotously intertextual genre novels that exists today . . . it is so clear that Wijeratne is having fun himself . . ."
  book: "The Salvage Crew"
  by: "Gautam Bhatia, author of The Wall, writing for Himal Southasian"
- text: "Numbercaste made my skin crawl in all the right ways as the real-world possibilities compounded."
  book: "Numbercaste"
  by: "Walt Noland, via Amazon"
- text: "I cannot even begin to tell you how awesome this is. I can happily say it is the best book I’ve read this year."
  book: "Numbercaste"
  by: "Navin Weeraratne, author of The Hundred Gram Mission"
