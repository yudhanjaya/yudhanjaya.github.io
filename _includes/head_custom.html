<link rel="alternate" type="application/atom+xml" title="{{ site.title }} Atom Feed" href="{{ '/feed.xml' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS Feed" href="{{ '/feed.xml' | relative_url }}">
<script>
  /* Apply the saved theme before first paint to avoid a flash. */
  try { var t = localStorage.getItem('atlas-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<script src="{{ '/assets/js/atlas.js' | relative_url }}" defer></script>
