<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>An advance against royalties: what the author has been paid as copies sell</title>
  <rect width="900" height="460" fill="#ffffff"/>
<g transform="translate(0,-0)">
  <text x="100" y="44" font-size="12" fill="#555">Hypothetical: $20 book, 10% royalty ($2 a copy), $10,000 advance</text>

  <!-- Plot area: x 100..820 (0..8000 copies), y 360..80 (0..16000 dollars) -->
  <!-- gridlines -->
  <g stroke="#e6e6e6">
    <line x1="100" y1="360" x2="820" y2="360"/>
    <line x1="100" y1="285" x2="820" y2="285"/>
    <line x1="100" y1="210" x2="820" y2="210"/>
    <line x1="100" y1="135" x2="820" y2="135"/>
    <line x1="100" y1="60" x2="820" y2="60"/>
  </g>
  <line x1="100" y1="60" x2="100" y2="360" stroke="#888"/>
  <line x1="100" y1="360" x2="820" y2="360" stroke="#888"/>

  <!-- y labels -->
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="92" y="364">$0</text>
    <text x="92" y="289">$4,000</text>
    <text x="92" y="214">$8,000</text>
    <text x="92" y="139">$12,000</text>
    <text x="92" y="64">$16,000</text>
  </g>
  <!-- x labels -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="100" y="380">0</text>
    <text x="280" y="380">2,000</text>
    <text x="460" y="380">4,000</text>
    <text x="640" y="380">6,000</text>
    <text x="820" y="380">8,000</text>
  </g>
  <text x="460" y="406" font-size="13" text-anchor="middle" fill="#555">copies sold</text>
  <text transform="translate(26,210) rotate(-90)" font-size="13" text-anchor="middle" fill="#555">dollars</text>

  <!-- Earn-out zone shading (copies 0..5000 = x 100..550) -->

  <!-- Royalties earned: dashed grey line from origin to (8000,16000) -->
  <line x1="100" y1="360" x2="820" y2="60" stroke="#888" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- Total paid to author: flat at 10,000 then rising -->
  <polyline points="100,172.5 550,172.5 820,60" fill="none" stroke="#1f7a5c" stroke-width="3.5"/>
  <!-- Crossing marker -->
  <circle cx="550" cy="172.5" r="6" fill="#1f7a5c"/>
  <line x1="550" y1="172.5" x2="550" y2="360" stroke="#1f7a5c" stroke-dasharray="3 4"/>
  <text x="560" y="205" font-size="13" font-weight="bold" fill="#1f7a5c">The book earns out at 5,000 copies</text>

  <!-- Legend / direct labels -->
  <text x="108" y="164" font-size="13" font-weight="bold" fill="#1f7a5c">Paid to you: $10,000 up front</text>
  <text x="170" y="310" font-size="12" fill="#555" transform="rotate(-22.6 170 310)">Royalties earned so far</text>
  <text x="690" y="150" font-size="12" font-weight="bold" fill="#1f7a5c">Total paid to you</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
